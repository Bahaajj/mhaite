<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="آخر أخبار وإعلانات وقرارات بلدية المحيدثة.">
  <title>أخبار البلدية | بلديّتنا</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="news.js"></script>
  <style>
    body{font-family:'Cairo',sans-serif;background:#f7f8f5;color:#23342a}.news-container{max-width:1100px;margin:auto;padding:32px 18px 60px}.news-head{margin-bottom:24px}.news-head h1{margin:6px 0;font-size:clamp(26px,4vw,38px)}.news-filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.news-filter{font:inherit;font-size:13px;border:1px solid #dce4dc;border-radius:999px;padding:8px 14px;background:white;cursor:pointer}.news-filter.active,.news-filter:hover{background:#315b43;color:white;border-color:#315b43}.news-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:18px}.news-card{display:flex;flex-direction:column;overflow:hidden;background:white;border:1px solid #e2e8e1;border-radius:14px;box-shadow:0 5px 20px #14281a0a}.news-card img{width:100%;height:205px;object-fit:cover;background:#edf2ec}.news-card-body{padding:17px;display:flex;flex-direction:column;flex:1}.news-category{align-self:flex-start;border-radius:999px;padding:4px 10px;background:#edf4ee;color:#315b43;font-size:12px;font-weight:700}.news-card h2{font-size:19px;line-height:1.6;margin:10px 0}.news-card p{line-height:1.9;margin:0 0 14px;white-space:pre-line}.news-date{font-size:12px;color:#718075;margin-top:auto;padding-top:10px}.news-link{display:inline-block;margin-top:12px;color:#315b43;font-weight:800;text-decoration:none}.news-link:hover{text-decoration:underline}.news-detail{background:white;border:1px solid #e2e8e1;border-radius:14px;overflow:hidden}.news-detail img{width:100%;max-height:480px;object-fit:cover;background:#edf2ec}.news-detail-body{padding:clamp(18px,4vw,36px)}.news-detail h1{font-size:clamp(24px,4vw,36px);line-height:1.5}.news-detail p{white-space:pre-line;line-height:2;font-size:16px}.news-state{padding:30px;text-align:center;color:#68756b;background:white;border:1px solid #e2e8e1;border-radius:12px}.back-link{display:inline-block;margin-bottom:16px;color:#315b43;font-weight:700;text-decoration:none}.news-footer{text-align:center;margin-top:35px;color:#718075;font-size:12px}[hidden]{display:none!important}
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="index.html"><img src="logo.jpeg" class="brand-mark"></img><span><strong>المحيدثة</strong><small>بلدية المحيدثة</small></span></a>
    <nav><a class="text-link" href="index.html">العودة إلى الموقع ←</a></nav>
  </div></header>
  <main class="news-container">
    <a id="back-to-list" class="back-link" href="news.html" hidden>← العودة إلى كل الأخبار</a>
    <header class="news-head"><span class="kicker">من أخبار البلدية</span><h1 id="page-title">أخبار وإعلانات البلدية</h1><p id="page-description">تابعوا قرارات البلدية وإعلاناتها ونشاطاتها وأخبار البلدة.</p></header>
    <div id="news-filters" class="news-filters" aria-label="تصنيف الأخبار"></div>
    <div id="news-content" class="news-grid" aria-live="polite"><p class="news-state">عم نحمل الأخبار...</p></div>
    <footer class="news-footer">المحيدثة — المصدر الرسمي لأخبار البلدية وإعلاناتها</footer>
  </main>
</body>
</html>
